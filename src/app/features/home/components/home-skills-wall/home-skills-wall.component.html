<div class="skills">
  <div class="skills__header">
    <h3>Habilidades</h3>
    <div class="skills__line"></div>
  </div>
  <ul class="skills__wrapper">
    @for (skill of skills(); track skill.name) {
    <li class="skills__btn">
      <img
        [src]="iconUrl(skill)"
        alt="Ícone da habilidade {{ skill.name }}"
      />
      {{ skill.name }}
      <div></div>
    </li>
    }
  </ul>
</div>
