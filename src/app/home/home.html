<main class="container">
  <div class="grid">
    <app-home-panel-left class="main-grid" />
    <app-home-panel-center class="main-grid" />
    <app-home-panel-right class="main-grid" />
    <footer class="footer">
      <div class="footer__bar"></div>
      <div class="footer__text">
        © {{ currentYear }} -
        @if (profile.value(); as profile) {
        <a
          class="footer__link"
          target="_blank"
          rel="noopener noreferrer"
          [href]="profile.repository"
          >Github</a
        >
        }
      </div>
      @if (loadFailed()) {
      <p class="load-error" role="alert" i18n="@@loadError">
        Não foi possível carregar todo o conteúdo.
        <button type="button" app-button (click)="retry()">Tentar novamente</button>
      </p>
      }
    </footer>
  </div>
</main>
