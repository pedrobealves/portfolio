<header class="header">
  <img src="assets/images/logo.svg" alt="" class="header__logo" />
  <div class="header__titles">
    @if (profile.value(); as profile) {
    <h1 class="header__title">{{ profile.name }}</h1>
    <p class="header__subtitle">{{ profile.description }}</p>
    }
  </div>
  <a class="header__lang" [href]="otherLocale.href" aria-label="Trocar idioma" i18n-aria-label="@@switchLanguage">{{ otherLocale.label }}</a>
</header>
