<div class="hatch">
  <button
    type="button"
    class="hatch__toggle"
    [attr.aria-expanded]="expanded()"
    aria-controls="education-content"
    (click)="toggle()"
  >
    <svg-icon aria-hidden="true" class="hatch__screw icon--soft-purple" src="assets/icons/screw.svg" />
    <span class="hatch__title" i18n="@@educationTitle">Educação</span>
    <svg-icon aria-hidden="true" class="hatch__screw icon--soft-purple" src="assets/icons/screw.svg" />
  </button>

  <div
    id="education-content"
    class="hatch__content"
    [class.hatch__content--open]="expanded()"
    [attr.inert]="!expanded() ? '' : null"
  >
    <div class="container">
      @for (education of educations.value(); track education.name) {
      <app-card-button>
        <button
          type="button"
          class="course"
          [attr.aria-label]="education.name"
          (click)="selected.set(education)"
        >
          <div class="course__frame">
            <img [src]="education.logo" [alt]="education.institution" class="course__logo" />
          </div>
        </button>
      </app-card-button>
      }
    </div>
  </div>
</div>

<app-detail-dialog
  [open]="selected() !== null"
  [title]="selected()?.name ?? ''"
  (closed)="selected.set(null)"
>
  @if (selected(); as education) {
  <p class="detail__period">
    {{ education.degree }} · {{ education.institution }} · {{ education.start }}<span>–{{ education.end }}</span>
  </p>
  <ul class="detail__list">
    <li>{{ education.description }}</li>
  </ul>
  }
</app-detail-dialog>
