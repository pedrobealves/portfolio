<div class="skills">
  <div class="skills__header">
    <h2 i18n="@@skillsTitle">Habilidades</h2>
    <div class="skills__line"></div>
  </div>
  <ul class="skills__wrapper" role="list">
    @for (skill of skills.value(); track skill.name) {
    <li class="skills__tag">
      <img
        [src]="iconUrl(skill)"
        alt="Ícone da habilidade {{ skill.name }}"
      />
      {{ skill.name }}
      <div></div>
    </li>
    }
  </ul>
</div>
